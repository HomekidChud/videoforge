name: Contribution rules
on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce docs-only contributions from non-maintainers
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          MAINTAINERS="HomekidChud"
          if echo ",$MAINTAINERS," | grep -q ",$PR_AUTHOR,"; then
            echo "$PR_AUTHOR is a maintainer; contribution rules do not apply."
            exit 0
          fi
          # Diff from the merge base, so an out-of-date branch does not drag in
          # unrelated changes. Any failure here fails the job: fail closed.
          FILES=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "Changed files in this PR:"
          echo "$FILES" | sed 's/^/  /'
          # Non-maintainers may only touch markdown files directly inside docs/.
          BAD=$(echo "$FILES" | grep -v '^docs/[^/]*\.md$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Community pull requests may only change markdown files inside docs/. This PR also changes:"
            echo "$BAD" | sed 's/^/  /'
            echo "Open an issue instead, and a maintainer will decide how it is handled. See CONTRIBUTING.md."
            exit 1
          fi
          if [ -z "$PR_BODY" ]; then
            echo "::error::The pull request description is empty. Say which page is affected, what was wrong, and how you checked the fix. See CONTRIBUTING.md."
            exit 1
          fi
          if [ "$(echo "$FILES" | wc -l)" -gt 5 ]; then
            echo "::error::This pull request changes more than five files. Keep each pull request to one page or one topic. See CONTRIBUTING.md."
            exit 1
          fi
          echo "Contribution rules passed."
